# Stack LIVE/PRODUCTION Warungku.
#
#   cp .env.live.example .env.live      # lalu isi APP_KEY + DB_PASSWORD
#   docker compose --env-file .env.live -f compose.live.yaml up -d --build
#
#   -> aplikasi http://127.0.0.1:8011
#   -> MySQL TIDAK dipublikasi ke host, hanya jaringan internal compose
#
# Perbedaan penting dari dev:
#   - kode DISALIN ke image saat build (tanpa bind mount) sehingga file di host
#     tidak bisa mengubah aplikasi yang sedang live;
#   - APP_ENV=production, APP_DEBUG=false;
#   - AUTO_MIGRATE=false -> migrasi selalu manual (`make live-migrate`);
#   - volume, nama project, database, dan port berbeda dari dev.
#
# Variabel ${...} dibaca dari file yang diberikan lewat --env-file.
name: warungku-live

services:
  mysql:
    image: mysql:8.4
    container_name: warungku-live-mysql
    restart: unless-stopped
    command: --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env.live}
      MYSQL_DATABASE: ${DB_DATABASE:-warungku}
      MYSQL_USER: ${DB_USERNAME:-warungku}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env.live}
    # Sengaja TIDAK ada bagian `ports:` — database live hanya bisa diakses dari
    # jaringan internal compose, tidak dari host/LAN.
    volumes:
      - warungku-live-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Live memakai stage `production`: kode disalin ke image & vendor dipasang
      # di dalam image, jadi server tidak bergantung pada file di host.
      target: production
    container_name: warungku-live-app
    working_dir: /var/www/html
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # Hanya data yang harus persisten; kode tidak di-mount.
      - warungku-live-storage:/var/www/html/storage/app
      - warungku-live-logs:/var/www/html/storage/logs
      - ./.env.live:/var/www/html/.env:ro
    ports:
      - "${APP_PORT:-8011}:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-warungku}
      DB_USERNAME: ${DB_USERNAME:-warungku}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env.live}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      AUTO_MIGRATE: "false"

volumes:
  warungku-live-mysql-data:
  warungku-live-storage:
  warungku-live-logs:
